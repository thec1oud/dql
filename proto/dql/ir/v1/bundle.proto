syntax = "proto3";

package dql.ir.v1;

import "dql/ir/v1/catalog.proto";
import "dql/ir/v1/diagnostics.proto";
import "dql/ir/v1/operators.proto";
import "dql/ir/v1/shapes.proto";

option go_package = "github.com/thec1oud/dql/proto/dql/ir/v1;irv1";

// The three IR layers travelling together at every plugin boundary (§2.2, §3.1).
message Bundle {
  IrVersion version = 1;
  // Optional IR capabilities the bundle uses (§3.3).
  repeated string required_features = 2;
  // Shared by every catalog (§5).
  Dialect dialect = 3;
  // Catalog layer.
  repeated Catalog catalogs = 4;
  // Published by the dialect plugin.
  CapabilityProfile capabilities = 5;
  // Shape layer (§14).
  ShapeLayer shapes = 6;
  // Query layer (§16).
  QueryLayer queries = 7;
  // Warnings carried through to emitters.
  repeated Diagnostic diagnostics = 8;
  // The operator catalog: the core's, the type plugins' and the dialect
  // plugin's, sorted by name (§9.1, §9.3).
  repeated Operator operators = 9;
}

// The IR version, semver (§3.3). The parts are explicit-presence fields so a
// zero minor or patch still appears in JSON, as in "version": {"major": 1,
// "minor": 0, "patch": 0}.
message IrVersion {
  optional uint32 major = 1;
  optional uint32 minor = 2;
  optional uint32 patch = 3;
}

enum Dialect {
  DIALECT_UNSPECIFIED = 0;
  DIALECT_POSTGRES = 1;
  // MySQL and MariaDB.
  DIALECT_MYSQL = 2;
  DIALECT_SQLITE = 3;
  DIALECT_SQLSERVER = 4;
}

// The dialect's capability profile (§9.2). Its other fields arrive with the
// dialect plugins.
message CapabilityProfile {
  Dialect dialect = 1;
  // The operators the dialect supports, sorted by name (§9.2).
  repeated OperatorSupport operators = 2;
  // Whether a reference may cross catalogs (§5.1).
  bool cross_catalog_references = 3;
}

// Shapes and the conversion table (§14), fully expanded so emitters never
// re-implement the algebra (§14.10).
message ShapeLayer {
  // Presets in every form, relation-qualified child shapes and custom
  // shapes, sorted by the dotted spelling of their ids (§3.2).
  repeated Shape shapes = 1;
  // The Ref, Link and change types of nested writes (§14.5, §14.6), sorted
  // by their host-name words.
  repeated RelationUnion unions = 2;
  // Sorted by the dotted spelling of from, then of to (§3.2).
  repeated Conversion conversions = 3;
  // One per conflict target of every entity that has one, sorted by entity
  // qualified name, then conflict target (§14.7).
  repeated Upsert upserts = 4;
  // One per keyed entity, sorted by qualified name (§8.9, §11.1).
  repeated KeyMerge merges = 5;
}

// Query entries (§16). Its fields arrive with M4.
message QueryLayer {}
