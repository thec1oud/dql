syntax = "proto3";

package dql.ir.v1;

import "dql/ir/v1/catalog.proto";
import "dql/ir/v1/diagnostics.proto";
import "dql/ir/v1/names.proto";
import "dql/ir/v1/objects.proto";
import "dql/ir/v1/operators.proto";
import "dql/ir/v1/queries.proto";
import "dql/ir/v1/shapes.proto";

option go_package = "github.com/thec1oud/dql/proto/dql/ir/v1;irv1";

// The three IR layers travelling together at every plugin boundary (§2.2, §3.1).
message Bundle {
  IrVersion version = 1;
  // Optional IR capabilities the bundle uses (§3.3).
  repeated string required_features = 2;
  // Shared by every catalog (§5).
  Dialect dialect = 3;
  // Catalog layer.
  repeated Catalog catalogs = 4;
  // Published by the dialect plugin.
  CapabilityProfile capabilities = 5;
  // Shape layer (§14).
  ShapeLayer shapes = 6;
  // Query layer (§16).
  QueryLayer queries = 7;
  // Warnings carried through to emitters.
  repeated Diagnostic diagnostics = 8;
  // The operator catalog: the core's, the type plugins' and the dialect
  // plugin's, sorted by name (§9.1, §9.3).
  repeated Operator operators = 9;
}

// The IR version, semver (§3.3). The parts are explicit-presence fields so a
// zero minor or patch still appears in JSON, as in "version": {"major": 1,
// "minor": 0, "patch": 0}.
message IrVersion {
  optional uint32 major = 1;
  optional uint32 minor = 2;
  optional uint32 patch = 3;
}

enum Dialect {
  DIALECT_UNSPECIFIED = 0;
  DIALECT_POSTGRES = 1;
  // MySQL and MariaDB.
  DIALECT_MYSQL = 2;
  DIALECT_SQLITE = 3;
  DIALECT_SQLSERVER = 4;
}

// The dialect's capability profile (§9.2), with its session setup and error
// mapping (§22.7, §23), its limits and its replica support (§22.5, §25.2,
// §26.4).
message CapabilityProfile {
  Dialect dialect = 1;
  // The operators the dialect supports, sorted by name (§9.2).
  repeated OperatorSupport operators = 2;
  // Whether a reference may cross catalogs (§5.1).
  bool cross_catalog_references = 3;
  // Statements every new connection runs, in order, such as the UTC session
  // time zone (§8.8, §22.7).
  repeated string session_setup = 4;
  // The native error codes that map into the taxonomy, sorted by code
  // (§23.1). A code not listed is a DatabaseError.
  repeated ErrorCode error_codes = 5;
  // How the database reports a violation of each of the catalogs' rules,
  // sorted by object, then kind, then what is reported (§23.2).
  repeated ViolationReport violations = 6;
  // The most parameters one statement may bind, which bulk writes split to
  // stay under (§25.2). Zero when the dialect's limit is not a count.
  uint32 max_params = 7;
  // The read consistency levels the dialect supports, sorted (§22.5). A read
  // at a level not listed runs on the primary.
  repeated ConsistencyLevel consistency_levels = 8;
  // How the runtime reads replica positions, set when consistency_levels
  // has a level beyond primary (§22.5).
  ReplicationQueries replication = 9;
  // The statement modes the dialect's drivers support, sorted; the first is
  // the default (§26.4).
  repeated StatementMode statement_modes = 10;
}

// The statements the runtime runs to route reads to replicas (§22.5).
message ReplicationQueries {
  // Runs on a primary after a commit and returns, as text, a position at
  // which a replica has replayed the commit.
  string position = 1;
  // Runs on a replica and returns how far behind it is in seconds, as a
  // float, or NULL when the server is not a replica.
  string lag = 2;
  // Runs on a replica with one parameter, a list of positions as text, and
  // returns whether it has replayed every one.
  string replayed = 3;
}

// How a driver sends statements (§26.4).
enum StatementMode {
  STATEMENT_MODE_UNSPECIFIED = 0;
  // Prepared and cached as named statements, for direct connections.
  STATEMENT_MODE_PREPARE = 1;
  // Unnamed statements, for transaction-level poolers such as PgBouncer in
  // transaction mode.
  STATEMENT_MODE_DESCRIBE = 2;
  // No preparation, for proxies that support nothing else.
  STATEMENT_MODE_SIMPLE = 3;
}

// A native error code and the taxonomy error it is (§23.1).
message ErrorCode {
  // Such as 23505 on Postgres.
  string code = 1;
  ErrorKind kind = 2;
}

// The errors of the taxonomy a native error code maps to (§23.1). The
// runtime raises the others itself.
enum ErrorKind {
  ERROR_KIND_UNSPECIFIED = 0;
  ERROR_KIND_UNIQUE_VIOLATION = 1;
  ERROR_KIND_FOREIGN_KEY_VIOLATION = 2;
  ERROR_KIND_CHECK_VIOLATION = 3;
  ERROR_KIND_NOT_NULL_VIOLATION = 4;
  ERROR_KIND_EXCLUSION_VIOLATION = 5;
  ERROR_KIND_SERIALIZATION_FAILURE = 6;
  ERROR_KIND_DEADLOCK = 7;
  ERROR_KIND_LOCK_TIMEOUT = 8;
  ERROR_KIND_CONNECTION = 9;
  ERROR_KIND_TIMEOUT = 10;
}

// How the database reports a violation of one rule of a catalog, so the
// runtime raises the typed constraint error that names it (§23.2).
message ViolationReport {
  ErrorKind kind = 1;
  // The table or domain the rule belongs to, with no member.
  QualifiedName object = 2;
  // What the database's error names: on Postgres, the constraint or unique
  // index, or the column of a not-null violation.
  string reported = 3;
  // The rule's name in the catalog: a constraint, uniqueness fact or
  // foreign key, or the column of a not-null violation.
  string rule = 4;
  // Whether the database's detail may hold the value of a sensitive
  // column, so the runtime drops it (§23.3).
  bool redact = 5;
}

// Shapes and the conversion table (§14), fully expanded so emitters never
// re-implement the algebra (§14.10).
message ShapeLayer {
  // Presets in every form, relation-qualified child shapes and custom
  // shapes, sorted by the dotted spelling of their ids (§3.2).
  repeated Shape shapes = 1;
  // The Ref, Link and change types of nested writes (§14.5, §14.6), sorted
  // by their host-name words.
  repeated RelationUnion unions = 2;
  // Sorted by the dotted spelling of from, then of to (§3.2).
  repeated Conversion conversions = 3;
  // One per conflict target of every entity that has one, sorted by entity
  // qualified name, then conflict target (§14.7).
  repeated Upsert upserts = 4;
  // One per keyed entity, sorted by qualified name (§8.9, §11.1).
  repeated KeyMerge merges = 5;
}

// Query entries and the fragment table they are assembled from (§16).
message QueryLayer {
  // From query files and the builder, sorted by name.
  repeated Query queries = 1;
  // Rendered by the dialect plugin (§16.2, §18.4).
  FragmentTable fragments = 2;
}

// The SQL pieces a dialect plugin renders for the builder, as templates
// with holes (§16.2, §18.4). The runtime fills holes and numbers
// placeholders; it never renders SQL itself.
message FragmentTable {
  Dialect dialect = 1;
  Placeholder placeholder = 2;
  // Sorted by id.
  repeated Fragment fragments = 3;
}

message Fragment {
  // Such as select.user_summary, col.users.email, op.ilike, clause.where
  // or wrap.distinct_on.
  string id = 1;
  // SQL with holes written {0} or {name}.
  string template = 2;
  // Set on operators and emulation wrappers (§9.2).
  Fidelity fidelity = 3;
}

// How a dialect writes the n-th placeholder.
enum Placeholder {
  PLACEHOLDER_UNSPECIFIED = 0;
  // $1, Postgres.
  PLACEHOLDER_DOLLAR_NUMBERED = 1;
  // ?, MySQL, MariaDB and SQLite.
  PLACEHOLDER_QUESTION = 2;
  // @p1, SQL Server.
  PLACEHOLDER_AT_NUMBERED = 3;
}
