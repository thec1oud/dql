syntax = "proto3";

// SQL Server objects the core does not model, carried losslessly as typed
// extensions in google.protobuf.Any (design record §6.2, §6.3). Their type
// URLs use the prefix "type.dql.dev/". The core passes them through
// unchanged.
package dql.ext.sqlserver.v1;

option go_package = "github.com/thec1oud/dql/proto/dql/ext/sqlserver/v1;sqlserverextv1";

// The server a catalog was read from, and the database's settings.
message Database {
  // SERVERPROPERTY('ProductVersion'), such as 16.0.4325.4.
  string version = 1;
  // The database's default collation.
  string collation = 2;
  uint32 compatibility_level = 3;
  // READ_COMMITTED_SNAPSHOT: read committed reads a statement's snapshot
  // instead of taking shared locks.
  bool read_committed_snapshot = 4;
  // ALLOW_SNAPSHOT_ISOLATION: transactions may run at SNAPSHOT.
  bool snapshot_isolation = 5;
}

// The raw text of an MS_Description extended property, kept beside the
// annotations read from it (§7.5).
message Comment {
  string text = 1;
}

// An alias type a column was declared with, as CREATE TYPE ... FROM made
// it: the column's type is its base type.
message AliasType {
  string schema = 1;
  string name = 2;
}

// An IDENTITY column's numbering.
message Identity {
  string seed = 1;
  string increment = 2;
}

// The default constraint that gives a column its default, which SQL Server
// names; the default itself is the column's (§11.3).
message DefaultConstraint {
  string name = 1;
}

// The table's ROWGUIDCOL, the uniqueidentifier column $ROWGUID names.
message RowGuidColumn {}

// A view's definition, as sys.sql_modules holds it.
message ViewDefinition {
  string definition = 1;
  // WITH CHECK OPTION.
  bool check_option = 2;
  // WITH SCHEMABINDING.
  bool schema_bound = 3;
}

// An index that is not a uniqueness fact, or the index a uniqueness fact is
// enforced by.
message Index {
  string name = 1;
  // CLUSTERED, NONCLUSTERED, or another of sys.indexes' type_desc.
  string type = 2;
  bool unique = 3;
  // The WHERE clause of a filtered index, as SQL Server prints it.
  string filter = 4;
  repeated IndexPart parts = 5;
  // INCLUDE columns, which the index carries but does not order by.
  repeated string included = 6;
  bool disabled = 7;
  // The index's MS_Description, for an index that is no uniqueness fact.
  string comment = 8;
}

// One key column of an index.
message IndexPart {
  string column = 1;
  bool descending = 2;
}

// A check constraint SQL Server does not enforce: disabled, or not trusted
// to hold for rows written while it was.
message UntrustedCheck {
  string name = 1;
  bool disabled = 2;
  bool not_trusted = 3;
}

// A foreign key SQL Server does not enforce.
message UntrustedForeignKey {
  string name = 1;
  bool disabled = 2;
  bool not_trusted = 3;
}

// A table's trigger.
message Trigger {
  string name = 1;
  // AFTER or INSTEAD OF.
  string timing = 2;
  // INSERT, UPDATE and DELETE, in that order, as far as the trigger fires on them.
  repeated string events = 3;
  bool disabled = 4;
  // The CREATE TRIGGER statement, as sys.sql_modules holds it.
  string definition = 5;
}

// A function or procedure that is not exposed (§6.5), carried whole.
message Routine {
  string name = 1;
  // sys.objects' type_desc, such as SQL_SCALAR_FUNCTION or SQL_STORED_PROCEDURE.
  string type = 2;
  string definition = 3;
  string comment = 4;
}

// An exposed routine's definition.
message RoutineProperties {
  // sys.objects' type_desc.
  string type = 1;
  string definition = 2;
  // WITH SCHEMABINDING.
  bool schema_bound = 3;
}
