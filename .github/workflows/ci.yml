name: ci

on:
  pull_request:
  push:
    branches: [master, dev]

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: bufbuild/buf-action@v1
        with:
          input: proto
          lint: true
          format: false
          breaking: false
          push: false
          # The workflow token cannot post PR comments; lint results show as annotations.
          pr_comment: false
      - name: buf breaking against the last release
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$tag" ]; then echo "no release yet"; exit 0; fi
          buf breaking proto --against ".git#tag=$tag,subdir=proto"
      - name: generated code is current
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          export PATH="$(go env GOPATH)/bin:$PATH"
          (cd proto && buf generate)
          git diff --exit-code

  go:
    runs-on: ubuntu-latest
    env:
      DQL_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DQL_TEST_POSTGRES_REPLICA_URL: postgres://postgres:postgres@localhost:5433/postgres?sslmode=disable
      DQL_TEST_MYSQL_URL: root:root@tcp(localhost:3306)/
      DQL_TEST_MYSQL_REPLICA_URL: root:root@tcp(localhost:3308)/
      DQL_TEST_MARIADB_URL: root:root@tcp(localhost:3307)/
      DQL_TEST_SQLSERVER_URL: sqlserver://sa:Dql-Test-2026!@localhost:1433
    steps:
      - uses: actions/checkout@v4
      - name: start Postgres with a streaming replica
        run: docker compose -f conformance/replica/compose.yaml up -d --wait
      - name: start MySQL with a replica, and MariaDB
        run: docker compose -f conformance/mysql/compose.yaml up -d --wait
      - name: start SQL Server
        run: docker compose -f conformance/sqlserver/compose.yaml up -d --wait
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: build the TypeScript runtime, which the ts emitter's golden package is checked against
        working-directory: runtime/ts
        run: bun install --frozen-lockfile && bun run build
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: vet
        # The SQLite and T-SQL grammars are generated by ANTLR, whose output vet flags.
        run: |
          go vet $(go list $(go work edit -json | sed -n 's/.*"DiskPath": "\(.*\)".*/\1\/.../p') | grep -v -e '/querysources/sqlite/grammar$' -e '/querysources/sqlserver/grammar$')
      - name: test with 100% coverage
        run: scripts/coverage.sh
      - name: determinism under a Turkish locale
        env:
          LANG: tr_TR.UTF-8
        run: scripts/coverage.sh

  # pg-live reads pg_catalog, which changes between major versions. The go
  # job runs everything on 16; this runs every test on 15, the minimum
  # supported release, and on the newer releases too.
  postgres-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["15", "17", "18"]
    env:
      DQL_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DQL_TEST_POSTGRES_REPLICA_URL: postgres://postgres:postgres@localhost:5433/postgres?sslmode=disable
      DQL_TEST_MYSQL_URL: root:root@tcp(localhost:3306)/
      DQL_TEST_MYSQL_REPLICA_URL: root:root@tcp(localhost:3308)/
      DQL_TEST_MARIADB_URL: root:root@tcp(localhost:3307)/
      DQL_TEST_SQLSERVER_URL: sqlserver://sa:Dql-Test-2026!@localhost:1433
    steps:
      - uses: actions/checkout@v4
      - name: start Postgres ${{ matrix.postgres }} with a streaming replica
        env:
          POSTGRES_VERSION: ${{ matrix.postgres }}
        run: docker compose -f conformance/replica/compose.yaml up -d --wait
      - name: start MySQL with a replica, and MariaDB
        run: docker compose -f conformance/mysql/compose.yaml up -d --wait
      - name: start SQL Server
        run: docker compose -f conformance/sqlserver/compose.yaml up -d --wait
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: build the TypeScript runtime, which the ts emitter's golden package is checked against
        working-directory: runtime/ts
        run: bun install --frozen-lockfile && bun run build
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: test against Postgres ${{ matrix.postgres }}
        run: |
          go test $(go work edit -json | sed -n 's/.*"DiskPath": "\(.*\)".*/\1\/.../p')

  # mysql-live reads information_schema, which differs between MySQL and
  # MariaDB and between MariaDB releases. The go job runs everything on
  # MariaDB 11.8, the newest LTS; this runs every test on 10.11, the oldest
  # supported one.
  mariadb-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mariadb: ["10.11"]
    env:
      DQL_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DQL_TEST_POSTGRES_REPLICA_URL: postgres://postgres:postgres@localhost:5433/postgres?sslmode=disable
      DQL_TEST_MYSQL_URL: root:root@tcp(localhost:3306)/
      DQL_TEST_MYSQL_REPLICA_URL: root:root@tcp(localhost:3308)/
      DQL_TEST_MARIADB_URL: root:root@tcp(localhost:3307)/
      DQL_TEST_SQLSERVER_URL: sqlserver://sa:Dql-Test-2026!@localhost:1433
    steps:
      - uses: actions/checkout@v4
      - name: start Postgres with a streaming replica
        run: docker compose -f conformance/replica/compose.yaml up -d --wait
      - name: start MySQL with a replica, and MariaDB ${{ matrix.mariadb }}
        env:
          MARIADB_VERSION: ${{ matrix.mariadb }}
        run: docker compose -f conformance/mysql/compose.yaml up -d --wait
      - name: start SQL Server
        run: docker compose -f conformance/sqlserver/compose.yaml up -d --wait
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: build the TypeScript runtime, which the ts emitter's golden package is checked against
        working-directory: runtime/ts
        run: bun install --frozen-lockfile && bun run build
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: test against MariaDB ${{ matrix.mariadb }}
        run: |
          go test $(go work edit -json | sed -n 's/.*"DiskPath": "\(.*\)".*/\1\/.../p')

  # The TypeScript runtime: a build, type checks, and its unit tests on
  # Bun with 100% coverage. @dql/pg's tests run against Postgres and its
  # streaming replica, @dql/mysql's against MySQL, and @dql/sqlserver's
  # against SQL Server.
  ts:
    runs-on: ubuntu-latest
    env:
      DQL_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DQL_TEST_POSTGRES_REPLICA_URL: postgres://postgres:postgres@localhost:5433/postgres?sslmode=disable
      DQL_TEST_MYSQL_URL: root:root@tcp(localhost:3306)/
      DQL_TEST_SQLSERVER_URL: sqlserver://sa:Dql-Test-2026!@localhost:1433
    defaults:
      run:
        working-directory: runtime/ts
    steps:
      - uses: actions/checkout@v4
      - name: start Postgres with a streaming replica
        working-directory: .
        run: docker compose -f conformance/replica/compose.yaml up -d --wait
      - name: start MySQL
        working-directory: .
        run: docker compose -f conformance/mysql/compose.yaml up -d --wait mysql
      - name: start SQL Server
        working-directory: .
        run: docker compose -f conformance/sqlserver/compose.yaml up -d --wait
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      # A package type checks against the built declarations of those it uses.
      - run: bun run build
      - run: bun run typecheck
      - name: test with 100% coverage
        run: bun run coverage

  # The conformance scenarios on TypeScript (guide M5, M6): the harness's
  # own tests on Bun with 100% coverage, then every scenario on Postgres,
  # MySQL, MariaDB and SQLite on Node, Bun and Deno, each runtime's outcomes
  # compared with Go's for identity.
  ts-conformance:
    runs-on: ubuntu-latest
    env:
      DQL_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      DQL_TEST_POSTGRES_REPLICA_URL: postgres://postgres:postgres@localhost:5433/postgres?sslmode=disable
      DQL_TEST_MYSQL_URL: root:root@tcp(localhost:3306)/
      DQL_TEST_MYSQL_REPLICA_URL: root:root@tcp(localhost:3308)/
      DQL_TEST_MARIADB_URL: root:root@tcp(localhost:3307)/
      DQL_TEST_SQLSERVER_URL: sqlserver://sa:Dql-Test-2026!@localhost:1433
    defaults:
      run:
        working-directory: conformance/harness/ts
    steps:
      - uses: actions/checkout@v4
      - name: start Postgres with a streaming replica
        working-directory: .
        run: docker compose -f conformance/replica/compose.yaml up -d --wait
      - name: start MySQL with a replica, and MariaDB
        working-directory: .
        run: docker compose -f conformance/mysql/compose.yaml up -d --wait
      - name: start SQL Server
        working-directory: .
        run: docker compose -f conformance/sqlserver/compose.yaml up -d --wait
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.6"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: build the TypeScript runtime
        working-directory: runtime/ts
        run: bun install --frozen-lockfile && bun run build
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: test with 100% coverage
        run: bun run coverage
      - name: Go's outcomes
        working-directory: conformance/harness/go
        # Every dialect, SQL Server too, which the TypeScript harness does
        # not run yet.
        run: DQL_CONFORMANCE_OUTCOMES="$RUNNER_TEMP/outcomes/go" go test -count=1 -run 'TestScenarios' .
      - name: every scenario on Node
        run: DQL_CONFORMANCE_OUTCOMES="$RUNNER_TEMP/outcomes/node" node --import ./src/node.ts src/main.ts
      - name: every scenario on Bun
        run: DQL_CONFORMANCE_OUTCOMES="$RUNNER_TEMP/outcomes/bun" bun src/main.ts
      - name: every scenario on Deno
        run: DQL_CONFORMANCE_OUTCOMES="$RUNNER_TEMP/outcomes/deno" deno run -A src/main.ts
      - name: the outcomes are identical to Go's
        run: |
          for runtime in node bun deno; do
            echo "$runtime:"
            bun src/check.ts "$RUNNER_TEMP/outcomes/go" "$RUNNER_TEMP/outcomes/$runtime"
          done

  rules:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: commit messages carry no forbidden content
        run: |
          if git log --format=%B "origin/${{ github.base_ref }}..HEAD" \
            | grep -iE 'claude|anthropic|co-authored-by:|signed-off-by:|generated with'; then
            echo "forbidden content in commit messages"; exit 1
          fi
      - name: ADRs are immutable
        run: |
          if git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- docs/adr \
            | grep -E '^(M|D|R)'; then
            echo "existing ADRs must not be modified, renamed or deleted"; exit 1
          fi
