# The running example's dql.yaml (§1.3) on SQL Server: conformance/schemas/
# sqlserver/shop.sql through sqlserver-live and the sqlserver dialect. The
# database is the catalog and app its namespace, as on Postgres.
sources:
  - plugin: sqlserver-live
    catalog: shop
    connection: env:SHOP_SQLSERVER_URL
    default-namespace: app   # objects in app get no namespace prefix (§4.3)

annotations:
  shop.app.tenants:         { name: tenant }
  shop.app.users:           { name: user }
  shop.app.profiles:        { name: profile }
  shop.app.posts:           { name: post }
  shop.app.tags:            { name: tag }
  shop.app.post_tags:       { name: post_tag }
  shop.app.published_posts: { name: published_post }
  shop.app.profiles.profiles_user_id_fkey: { inverse-name: profile }
  shop.app.posts.posts_author_id_fkey:     { collection-policy: replace, removal: delete }

queries:
  - queries.sql
