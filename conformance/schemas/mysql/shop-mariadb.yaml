# The running example's dql.yaml (§1.3) on MariaDB: shop.sql, which loads on
# MySQL and MariaDB alike, through mysql-live and the mysql dialect's MariaDB
# profile. A MariaDB database is the catalog, with one implicit namespace, so
# names have no app. part. Its Go package is
# conformance/harness/go/testdata/mariadbshopdb, and its TypeScript package
# conformance/harness/ts/mariadbshopdb.
sources:
  - plugin: mysql-live
    catalog: shop
    connection: env:SHOP_MARIADB_DSN

annotations:
  shop.tenants:         { name: tenant }
  shop.users:           { name: user }
  shop.profiles:        { name: profile }
  shop.posts:           { name: post }
  shop.tags:            { name: tag }
  shop.post_tags:       { name: post_tag }
  shop.published_posts: { name: published_post }
  shop.profiles.profiles_user_id_fkey: { inverse-name: profile }
  shop.posts.posts_author_id_fkey:     { collection-policy: replace, removal: delete }

queries:
  - queries.sql

emit:
  - plugin: go
    dialect: mysql
    package: mariadbshopdb
    out: mariadbshopdb
  - plugin: ts
    dialect: mysql
    out: ts/mariadbshopdb
