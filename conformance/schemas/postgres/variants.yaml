# The running example's dql.yaml (§1.3) with the design record's variants of
# it: posts.deleted_at is soft-delete (§21.3), posts.labels has non-null
# elements (§8.6), and the read shapes of §14.8. Its Go package is
# conformance/harness/go/testdata/variantdb.
sources:
  - plugin: pg-live
    catalog: shop
    connection: env:SHOP_DATABASE_URL
    namespaces: [app]
    default-namespace: app

annotations:
  shop.app.tenants:         { name: tenant }
  shop.app.users:           { name: user }
  shop.app.profiles:        { name: profile }
  shop.app.posts:           { name: post }
  shop.app.tags:            { name: tag }
  shop.app.post_tags:       { name: post_tag }
  shop.app.published_posts: { name: published_post }
  shop.app.profiles.profiles_user_id_fkey: { inverse-name: profile }
  shop.app.posts.posts_author_id_fkey:     { collection-policy: replace, removal: delete }
  shop.app.posts.deleted_at: { soft-delete }
  shop.app.posts.labels:     { array-elements-nonnull }

shapes:
  user_summary:
    from: user.full
    pick: [id, email, display_name]
  user_summary_named:
    from: user_summary
    nonnull: [display_name]
  post_with_tags:
    from: post.full
    nest:
      tags: tag.full
      author: user_summary

emit:
  - plugin: go
    dialect: postgres
    package: variantdb
    out: variantdb
