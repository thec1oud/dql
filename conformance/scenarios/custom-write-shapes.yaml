scenario: custom-write-shapes
schema: shop_variants
# Custom write shapes (design record §14.8): a shape derived from the Draft
# inserts through Insert<Shape>, with its bound fields as parameters, and one
# derived from the Partial patches through Patch<Shape>. Each returns the
# Full and validates its payload first.
steps:
  - op: tenants.insert
    input: { name: acme }
    save: acme
  # signup keeps two of the Draft's fields; the rest take their defaults.
  - op: users.insert_signup
    scope: { tenant_id: $acme.id }
    input: { email: a@acme.com, password_hash: x }
    save: ann
    expect:
      row: { email: a@acme.com, display_name: null, version: 1 }
      events:
        - { query: user.insert.signup, rows: 1, redacted: 1 }
  # quick_invite binds password_hash: it is passed beside the payload, and
  # stays redacted in hooks.
  - op: users.insert_quick_invite
    scope: { tenant_id: $acme.id }
    input: { email: b@acme.com }
    bind: [invited]
    save: bob
    expect:
      row: { email: b@acme.com }
      events:
        - { query: user.insert.quick_invite, rows: 1, redacted: 1 }
  # password_hash is write-only, so the Full leaves it out: the database
  # holds the bound value.
  - op: sql
    sql:
      postgres: |
        DO $$ BEGIN
          IF NOT EXISTS (SELECT 1 FROM app.users WHERE email = 'b@acme.com' AND password_hash = 'invited') THEN
            RAISE EXCEPTION 'quick_invite did not write the bound password_hash';
          END IF;
        END $$
  # The payload is validated before anything is sent.
  - op: users.insert_quick_invite
    scope: { tenant_id: $acme.id }
    input: { email: "@acme.com" }
    bind: [invited]
    expect:
      error: { class: ValidationErrors, kind: length, field: email }
      statements: 0
  # A bound field set by an expression too is FieldSetTwice.
  - op: users.insert_quick_invite
    scope: { tenant_id: $acme.id }
    input: { email: c@acme.com }
    bind: [invited]
    assign: [{ column: password_hash, set: default }]
    expect:
      error: { class: ValidationErrors, kind: field_set_twice, field: password_hash }
  # Errors map as for Insert.
  - op: users.insert_quick_invite
    scope: { tenant_id: $acme.id }
    input: { email: b@acme.com }
    bind: [again]
    expect:
      error: { class: UniqueViolation, constraint: users_tenant_email_key, hides: again }
  # rename patches one field and compares the version, as Patch does.
  - op: users.patch_rename
    scope: { tenant_id: $acme.id }
    key: { id: $ann.id, version: 1 }
    input: { display_name: Ann }
    expect:
      row: { display_name: Ann, email: a@acme.com, version: 2 }
  - op: users.patch_rename
    scope: { tenant_id: $acme.id }
    key: { id: $ann.id, version: 1 }
    input: { display_name: Anne }
    expect:
      error: { class: ConcurrentModification }
  - op: users.patch_rename
    scope: { tenant_id: $acme.id }
    key: { id: 999999, version: 1 }
    input: { display_name: Nobody }
    expect:
      error: { class: NotFound }
