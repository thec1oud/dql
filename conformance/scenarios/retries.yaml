scenario: retries
schema: shop
requires: [deadlock, lock-timeout]
# The serialization failures of §22.4 are in serialization-retries.yaml,
# since SQL Server raises one only under snapshot isolation.
steps:
  # A deadlock reruns the closure, which then commits once (§22.4).
  - op: write
    inject: { class: Deadlock, times: 1 }
    steps:
      - op: tenants.insert
        input: { name: acme }
        save: acme
    expect: { attempts: 2 }
  - op: write
    isolation: serializable
    inject: { class: Deadlock, times: 2 }
    steps:
      - op: tenants.insert
        input: { name: globex }
    expect: { attempts: 3 }
  - op: tenants.count
    expect: { value: 2 }
  # When every run fails, the last failure is reported, after the policy's
  # attempts.
  - op: write
    retry: { attempts: 2 }
    inject: { class: Deadlock, times: 3 }
    steps:
      - op: tenants.insert
        input: { name: initech }
    expect:
      attempts: 2
      error: { class: Deadlock }
  - op: tenants.count
    expect: { value: 2 }
  # Other failures are not retried.
  - op: write
    steps:
      - op: tenants.insert
        input: { id: $acme.id, name: again }
    expect:
      attempts: 1
      error: { class: UniqueViolation }
  # Retry(policy).Do reruns after the classes its policy names, such as a
  # lock timeout, which closures never rerun (§22.4).
  - op: write
    inject: { class: LockTimeout, times: 1 }
    steps:
      - op: tenants.insert
        input: { name: hooli }
    expect:
      attempts: 1
      error: { class: LockTimeout }
  - op: retry
    retry: { attempts: 3, on: [LockTimeout] }
    inject: { class: LockTimeout, times: 2 }
    steps:
      - op: tenants.insert
        input: { name: hooli }
    expect: { attempts: 3 }
  # Without On, Do reruns what closures do, so a lock timeout is final.
  - op: retry
    retry: { attempts: 3 }
    inject: { class: LockTimeout, times: 1 }
    steps:
      - op: tenants.insert
        input: { name: umbrella }
    expect:
      attempts: 1
      error: { class: LockTimeout }
  - op: tenants.count
    expect: { value: 3 }
