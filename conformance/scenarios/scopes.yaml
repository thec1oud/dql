scenario: scopes
schema: shop
steps:
  - op: tenants.insert
    input: { name: acme }
    save: acme
  - op: tenants.insert
    input: { name: globex }
    save: globex
  - op: users.insert
    scope: { tenant_id: $acme.id }
    input: { email: a@acme.com, password_hash: x }
    save: ann
  # Another tenant's handle sees none of acme's rows.
  - op: users.get
    scope: { tenant_id: $globex.id }
    key: { id: $ann.id, version: 1 }
    expect:
      error: { class: NotFound }
  - op: users.count
    scope: { tenant_id: $globex.id }
    expect:
      value: 0
  # The same email is free in another tenant.
  - op: users.insert
    scope: { tenant_id: $globex.id }
    input: { email: a@acme.com, password_hash: x }
    expect:
      row: { tenant_id: $globex.id }
  # A transaction begun from a scoped handle inherits its scope (§22.3):
  # its writes take the scope's tenant, and its reads see only that
  # tenant's rows, its own uncommitted one among them.
  - op: write
    scope: { tenant_id: $acme.id }
    steps:
      - op: users.insert
        input: { email: b@acme.com, password_hash: x }
        expect:
          row: { tenant_id: $acme.id }
      - op: users.count
        expect: { value: 2 }
  - op: users.count
    scope: { tenant_id: $globex.id }
    expect: { value: 1 }
