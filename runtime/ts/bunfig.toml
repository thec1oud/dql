# Every package's hand-written code is held to 100% coverage, as the Go
# modules are (scripts/coverage.sh).
[test]
root = "."
coverageThreshold = 1.0
coverageSkipTestFiles = true
coverageReporter = ["text"]
# A package's tests import the others' built output, which their own tests cover.
coveragePathIgnorePatterns = ["**/dist/**"]
